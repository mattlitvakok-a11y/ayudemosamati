name: Importar fotos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar y preparar
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null
          mkdir -p fotos
          : > fotos/manifest.txt
          bajar () {  # id slug
            url="https://drive.google.com/thumbnail?id=$1&sz=w1600"
            curl -sL --max-time 60 "$url" -o /tmp/raw
            tipo=$(file -b --mime-type /tmp/raw)
            if [ "$tipo" = "image/jpeg" ] || [ "$tipo" = "image/png" ] || [ "$tipo" = "image/webp" ]; then
              convert /tmp/raw -auto-orient -strip -resize '1400x1400>' -quality 82 "fotos/$2.jpg" \
                && echo "OK $2 $(stat -c%s fotos/$2.jpg)" >> fotos/manifest.txt \
                || echo "FALLO-CONVERT $2 $tipo" >> fotos/manifest.txt
            else
              echo "FALLO-DESCARGA $2 $tipo $(head -c 120 /tmp/raw | tr -d '\n')" >> fotos/manifest.txt
            fi
          }
          bajar 1bluFNeaZaoFeUjrZx-zuT_RhSwPOa3IK 2024-08-07-entrega-a
          bajar 1I6p5Wt2FJh993DwuHhWvdSKImD1_JtYB 2024-08-07-entrega-b
          bajar 1HLZwsRfkD0Wbc7cPyCK8rDd9ciLNhDsI 2024-08-14-llaves
          bajar 1POJ3t9ceghXNRT6ogV3DF6MiHH8cDBdb 2024-08-22-arreglos-a
          bajar 1eFu0GtFjiOAj7hgBS3zd8uv3eFgU7t84 2024-08-22-arreglos-b
          bajar 1BxxG9A5-nWt2yvplb-q4wmmNmeFt_14w 2024-08-26-humedades-a
          bajar 1MTpy9hJnkfMVxaRagXcT1OxZXtGAW8Aj 2024-09-04-humedades-b
          bajar 1AIS-gRg0ecjq31E2ERti-6NAl87wH_rt 2024-09-18-cartel-alma-a
          bajar 13CS3YOVEVDbF7iR1tCSAzIyT67cJUuhY 2024-09-18-cartel-alma-b
          bajar 1uL5tvnwPxQZONnD_JmHunjMZ9B-Zog-w 2024-10-28-humedades-c
          bajar 1OBbRzN_srtqGYAkDHQ2dKIhPuduGrNrA 2024-10-28-humedades-d
          cat fotos/manifest.txt
      - name: Commitear
        run: |
          git config user.name "importador"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Importa fotos candidatas (rama de revision)" || echo "sin cambios"
          git push
